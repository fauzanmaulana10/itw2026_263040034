<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Styling Table</title>
</head>
<body>
    <table border="1" cellspacing="0" cellpading="10">
        <tr>
            <td> rowspan="3">rowspan = 3</td>
            <td> colspan="2">colspan = 2</td>
        </tr>
        <tr>
            <td>2,2</td>
            <td>2,23</td>
        </tr>
        <tr>
            <td>3,2</td>
            <td>3,3</td>
        </tr>
    </table>
    
</body>
</html>
