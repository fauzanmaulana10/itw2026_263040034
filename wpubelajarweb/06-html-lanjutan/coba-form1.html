<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Element Form</title>
</head>
<body>
    
</body>
  <h1>Contoh elemen-elemen form pada HTML</h1>

<form>
    <label for="nama">Nama:
    <input type="text" name="nama" id="nama" placeholder="Masukkan nama anda">
    </label>
    <br>

    <Label for="password">password:
    <input type="password" name="password" id="password" placeholder="Masukkan password anda">
    </Label>
    <br>

    <Label for="email">Email:
    <input type="email" name="email" id="email" placeholder="Masukkan email anda">
    </Label>
    <br>

    <Label for="angka">Angka:
        <input type="number" name="number" id="number" placeholder="Masukkan alamat anda">
    </Label>
    <br>

    <Label for="Tanggal">Tanggal:
        <input type="date" name="Tanggal" id="Tanggal">
    </Label>
    <br>

    <Label for="warna">Pilih Warna:
        <input type="color" name="warna" id="warna" placeholder="Masukkan warna anda">
    </Label>
    <br>

    <button type="submit">Kirim!</button>
</form>
</html>
